[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-rag"
version = "0.1.0"
description = "Page-aware multimodal retrieval augmented generation API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "python-multipart>=0.0.12,<1", "alembic>=1.14,<2",
  "pydantic-settings>=2.6,<3", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4",
  "celery[redis]>=5.4,<6", "redis>=5,<6", "qdrant-client>=1.12,<2", "minio>=7.2,<8",
  "pymupdf>=1.24,<2", "Pillow>=10,<12",
  "unstructured[pdf]>=0.18,<1", "langchain-core>=1.0,<2", "langchain-text-splitters>=1.0,<2",
  "langgraph>=1.0,<2",
  "sentence-transformers>=6,<7", "transformers>=5,<6",
  "httpx>=0.27,<1", "structlog>=24.4,<26", "pwdlib[argon2]>=0.2,<1", "itsdangerous>=2.2,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=6,<7", "httpx>=0.27,<1", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
